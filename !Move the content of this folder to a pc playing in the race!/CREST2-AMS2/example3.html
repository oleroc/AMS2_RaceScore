<html>
<head>
    <script type="text/javascript">
        function RequestData(URL){
            var xmlhttp = new XMLHttpRequest();
            xmlhttp.open("GET", URL, false);
            xmlhttp.send(null);
            
            if (xmlhttp.readyState == 4 && xmlhttp.status == 200) {
                var myArr = JSON.parse(xmlhttp.responseText);
                console.log(myArr);
                
                var output = "Track: " + myArr.eventInformation.mTranslatedTrackLocation + " - " + myArr.eventInformation.mTranslatedTrackVariation + 
                    "<br>Current Lap Time: " + myArr.timings.mLastLapTime +
                    "<br>Car: " + myArr.vehicleInformation.mCarName +
                    "<br>Car Class: " + myArr.vehicleInformation.mCarClassName +
                    "<br>Participants: " + myArr.participants.mNumParticipants;

                var raceResults = [];
                for (let i = 0; i < myArr.participants.mNumParticipants; i++) {
                    output += "<br>Current Lap Driver " + (i + 1) + ": " + myArr.participants.mParticipantInfo[i].mCurrentLap;
                    output += "<br>Driver name " + (i + 1) + ": " + myArr.participants.mParticipantInfo[i].mName;
                    output += "<br>Driver name " + (i + 1) + ": " + myArr.participants.mParticipantInfo[i].mFastestLapTimes;
                    output += "<br>Driver name " + (i + 1) + ": " + myArr.participants.mParticipantInfo[i].mRacePosition;
                    raceResults.push(myArr.participants.mParticipantInfo[i].mRacePosition);
                }

                for (let i = raceResults.length; i < 20; i++) {
                    raceResults.push(0);
                }

                output += "<br>Speed: " + (myArr.carState.mSpeed * 3.6).toFixed(0) + " km/h" +
                    "<br>Gear: " + myArr.carState.mGear +
                    "<br>Throttle: " + (myArr.carState.mThrottle * 100).toFixed(0) + " %" +
                    "<br>Brake: " + (myArr.carState.mBrake * 100).toFixed(0) + " %" +
                    "<br>Clutch: " + (myArr.carState.mClutch * 100).toFixed(0) + " %" +
                    "<br>mGamestates: " + myArr.gameStates.mGameState +
                    "<br>mSessionState: " + myArr.gameStates.mSessionState +
                    "<br>mSessionIsPrivate: " + myArr.gameStates.mSessionIsPrivate +
                    "<br>mRaceState: " + myArr.gameStates.mRaceState + //1: Race not started, 2: Green light, 3: Race Ended
                    "<br><br>Timestamp: " + new Date(myArr.timestamp);

                document.getElementById("data").innerHTML = output;

                if (myArr.gameStates.mRaceState === 3) {
                    WriteScoreFile(raceResults);
                }
            }
        }

        function WriteScoreFile(raceResults) {
            var fso = new ActiveXObject("Scripting.FileSystemObject");
            var filePath = "C:\\force\\gui\\score.txt";
            var file;
            if (fso.FileExists(filePath)) {
                file = fso.OpenTextFile(filePath, 8); // ForAppending
            } else {
                file = fso.CreateTextFile(filePath, true);
            }
            file.WriteLine(raceResults.join(";") + ";");
            file.Close();
        }

        function AutoReload(URL, interval) {
            document.getElementById('RequestAuto').innerText = "Running";
            document.getElementById('RequestAuto').disabled = true; 
            setInterval(function() { RequestData(URL); }, interval);
        }
    </script>
</head>
<body>
<p><button id="Request" onclick="RequestData('http://localhost:8180/crest2/v1/api');">Request (once)</button>
<button id="RequestAuto" onclick="AutoReload('http://localhost:8180/crest2/v1/api',500);">Request (Auto Reload)</button></p>
<p id="data"></p>
</body>
</html>
